name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    container:
      image: fedora:45
      # Nested Bubblewrap exercises the actual read-only and network boundaries.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          dnf install -y gcc-c++ cmake ninja-build extra-cmake-modules
          qt6-qtbase-devel qt6-qtwebengine-devel qt6-qtwebchannel-devel
          kf6-ktexteditor-devel kf6-kcoreaddons-devel kf6-kxmlgui-devel kf6-ki18n-devel
          nodejs24 nodejs24-bin python3 bubblewrap pipewire-utils xorg-x11-server-Xvfb xorg-x11-xauth
          shadow-utils util-linux dejavu-sans-fonts
      - name: Test as an unprivileged user
        run: |
          useradd -m tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          runuser -u tester -- ./scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
